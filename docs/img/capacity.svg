<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <style>
    .title { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .label { fill: #1f2328; font-size: 12px; }
    .value { fill: #1f2328; font-size: 12px; font-weight: 700; }
    .axis { stroke: #d0d7de; stroke-width: 1; }
    .tick { fill: #656d76; font-size: 10px; }
    .note { fill: #656d76; font-size: 11px; }
    .b1 { fill: #f85149; }
    .b2 { fill: #db6d28; }
    .b3 { fill: #d29922; }
    .b4 { fill: #58a6ff; }
    .b5 { fill: #3fb950; }
    .b6 { fill: #2da44e; }
    .b7 { fill: #1a7f37; }
    @media (prefers-color-scheme: dark) {
      .title { fill: #f0f6fc; }
      .label { fill: #f0f6fc; }
      .value { fill: #f0f6fc; }
      .axis { stroke: #3d444d; }
      .tick { fill: #9198a1; }
      .note { fill: #9198a1; }
    }
  </style>

  <text x="20" y="24" class="title">Requests per second, same machine, same data</text>

  <line x1="168" y1="38" x2="168" y2="248" class="axis"/>
  <line x1="326" y1="38" x2="326" y2="248" class="axis"/>
  <line x1="484" y1="38" x2="484" y2="248" class="axis"/>
  <line x1="642" y1="38" x2="642" y2="248" class="axis"/>

  <text x="168" y="264" text-anchor="middle" class="tick">1</text>
  <text x="326" y="264" text-anchor="middle" class="tick">10</text>
  <text x="484" y="264" text-anchor="middle" class="tick">100</text>
  <text x="642" y="264" text-anchor="middle" class="tick">1000</text>

  <text x="110" y="62" text-anchor="end" class="label">baseline</text>
  <rect x="120" y="48" width="48" height="20" class="b1" rx="2"/>
  <text x="176" y="63" class="value">1</text>

  <text x="110" y="92" text-anchor="end" class="label">+ one index</text>
  <rect x="120" y="78" width="281" height="20" class="b2" rx="2"/>
  <text x="409" y="93" class="value">30</text>

  <text x="110" y="122" text-anchor="end" class="label">+ right index</text>
  <rect x="120" y="108" width="376" height="20" class="b3" rx="2"/>
  <text x="504" y="123" class="value">120</text>

  <text x="110" y="152" text-anchor="end" class="label">+ no N+1</text>
  <rect x="120" y="138" width="459" height="20" class="b4" rx="2"/>
  <text x="587" y="153" class="value">400</text>

  <text x="110" y="182" text-anchor="end" class="label">+ 4 processes</text>
  <rect x="120" y="168" width="534" height="20" class="b5" rx="2"/>
  <text x="662" y="183" class="value">1200</text>

  <text x="110" y="212" text-anchor="end" class="label">+ prepared, schemas</text>
  <rect x="120" y="198" width="569" height="20" class="b6" rx="2"/>
  <text x="697" y="213" class="value">2000</text>

  <text x="110" y="242" text-anchor="end" class="label">+ Redis cache</text>
  <rect x="120" y="228" width="587" height="20" class="b7" rx="2"/>
  <text x="715" y="243" class="value">2600</text>

  <text x="20" y="288" class="note">Logarithmic scale. Nothing was added to the hardware. p99 on the task list went from 4980 ms</text>
  <text x="20" y="304" class="note">to under 100 ms, and above capacity the server returns 503 instead of making everyone wait.</text>
</svg>
