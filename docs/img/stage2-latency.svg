<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <style>
    .title { fill: #1f2328; font-size: 14px; font-weight: 600; }
    .label { fill: #1f2328; font-size: 12px; }
    .value { fill: #656d76; font-size: 11px; font-weight: 600; }
    .axis { stroke: #d0d7de; stroke-width: 1; }
    .tick { fill: #656d76; font-size: 10px; }
    .note { fill: #656d76; font-size: 11px; }
    .before { fill: #f85149; }
    .after { fill: #3fb950; }
    @media (prefers-color-scheme: dark) {
      .title { fill: #f0f6fc; }
      .label { fill: #f0f6fc; }
      .value { fill: #9198a1; }
      .axis { stroke: #3d444d; }
      .tick { fill: #9198a1; }
      .note { fill: #9198a1; }
    }
  </style>

  <text x="20" y="22" class="title">One index on comments.task_id</text>

  <rect x="270" y="12" width="10" height="10" class="before" rx="2"/>
  <text x="286" y="22" class="tick">before</text>
  <rect x="330" y="12" width="10" height="10" class="after" rx="2"/>
  <text x="346" y="22" class="tick">after</text>

  <line x1="170" y1="38" x2="170" y2="180" class="axis"/>
  <line x1="310" y1="38" x2="310" y2="180" class="axis"/>
  <line x1="450" y1="38" x2="450" y2="180" class="axis"/>
  <line x1="590" y1="38" x2="590" y2="180" class="axis"/>
  <line x1="730" y1="38" x2="730" y2="180" class="axis"/>

  <text x="170" y="196" text-anchor="middle" class="tick">1 ms</text>
  <text x="310" y="196" text-anchor="middle" class="tick">10 ms</text>
  <text x="450" y="196" text-anchor="middle" class="tick">100 ms</text>
  <text x="590" y="196" text-anchor="middle" class="tick">1 s</text>
  <text x="730" y="196" text-anchor="middle" class="tick">10 s</text>

  <text x="160" y="62" text-anchor="end" class="label">/tasks/:id</text>
  <rect x="170" y="48" width="282" height="18" class="before" rx="2"/>
  <text x="458" y="62" class="value">104 ms</text>
  <rect x="170" y="70" width="145" height="18" class="after" rx="2"/>
  <text x="321" y="84" class="value">10.9 ms</text>

  <text x="160" y="126" text-anchor="end" class="label">/projects/:id/tasks</text>
  <rect x="170" y="112" width="469" height="18" class="before" rx="2"/>
  <text x="645" y="126" class="value">2244 ms</text>
  <rect x="170" y="134" width="268" height="18" class="after" rx="2"/>
  <text x="444" y="148" class="value">82 ms, 27x faster</text>

  <text x="20" y="220" class="note">Logarithmic scale. Capacity went from 1 to 30 requests per second on the same machine.</text>
  <text x="20" y="236" class="note">The single count query behind this went from 638 ms to 0.077 ms.</text>
</svg>
