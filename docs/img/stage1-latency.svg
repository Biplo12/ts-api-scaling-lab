<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <style>
    .title { fill: #1f2328; font-size: 14px; font-weight: 600; }
    .label { fill: #1f2328; font-size: 12px; }
    .value { fill: #656d76; font-size: 12px; font-weight: 600; }
    .axis { stroke: #d0d7de; stroke-width: 1; }
    .tick { fill: #656d76; font-size: 10px; }
    .note { fill: #656d76; font-size: 11px; }
    .fast { fill: #3fb950; }
    .mid { fill: #d29922; }
    .slow { fill: #f85149; }
    @media (prefers-color-scheme: dark) {
      .title { fill: #f0f6fc; }
      .label { fill: #f0f6fc; }
      .value { fill: #9198a1; }
      .axis { stroke: #3d444d; }
      .tick { fill: #9198a1; }
      .note { fill: #9198a1; }
    }
  </style>

  <text x="20" y="24" class="title">Stage 1: median latency, one request at a time</text>

  <line x1="170" y1="44" x2="170" y2="176" class="axis"/>
  <line x1="310" y1="44" x2="310" y2="176" class="axis"/>
  <line x1="450" y1="44" x2="450" y2="176" class="axis"/>
  <line x1="590" y1="44" x2="590" y2="176" class="axis"/>
  <line x1="730" y1="44" x2="730" y2="176" class="axis"/>

  <text x="170" y="192" text-anchor="middle" class="tick">1 ms</text>
  <text x="310" y="192" text-anchor="middle" class="tick">10 ms</text>
  <text x="450" y="192" text-anchor="middle" class="tick">100 ms</text>
  <text x="590" y="192" text-anchor="middle" class="tick">1 s</text>
  <text x="730" y="192" text-anchor="middle" class="tick">10 s</text>

  <text x="160" y="68" text-anchor="end" class="label">/health</text>
  <rect x="170" y="52" width="32" height="24" class="fast" rx="2"/>
  <text x="212" y="68" class="value">1.7 ms</text>

  <text x="160" y="112" text-anchor="end" class="label">/tasks/:id</text>
  <rect x="170" y="96" width="282" height="24" class="mid" rx="2"/>
  <text x="462" y="112" class="value">104 ms, 61x slower</text>

  <text x="160" y="156" text-anchor="end" class="label">/projects/:id/tasks</text>
  <rect x="170" y="140" width="469" height="24" class="slow" rx="2"/>
  <text x="649" y="156" class="value">2244 ms</text>

  <text x="20" y="216" class="note">Logarithmic scale, so the bars hide the real gap. The task list is 21x slower than task details</text>
  <text x="20" y="232" class="note">and 1320x slower than /health. It runs 42 queries, 21 of them full table scans.</text>
</svg>
