<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <style>
    .title { fill: #1f2328; font-size: 14px; font-weight: 600; }
    .label { fill: #1f2328; font-size: 12px; }
    .value { fill: #656d76; font-size: 11px; font-weight: 600; }
    .axis { stroke: #d0d7de; stroke-width: 1; }
    .tick { fill: #656d76; font-size: 10px; }
    .note { fill: #656d76; font-size: 11px; }
    .bad { fill: #f85149; }
    .good { fill: #3fb950; }
    @media (prefers-color-scheme: dark) {
      .title { fill: #f0f6fc; }
      .label { fill: #f0f6fc; }
      .value { fill: #9198a1; }
      .axis { stroke: #3d444d; }
      .tick { fill: #9198a1; }
      .note { fill: #9198a1; }
    }
  </style>

  <text x="20" y="22" class="title">Queries reaching Postgres, one hot key with a 2 second TTL</text>

  <rect x="450" y="12" width="10" height="10" class="bad" rx="2"/>
  <text x="466" y="21" class="tick">plain cache</text>
  <rect x="560" y="12" width="10" height="10" class="good" rx="2"/>
  <text x="576" y="21" class="tick">with singleflight</text>

  <line x1="160" y1="40" x2="160" y2="176" class="axis"/>
  <line x1="300" y1="40" x2="300" y2="176" class="axis"/>
  <line x1="440" y1="40" x2="440" y2="176" class="axis"/>
  <line x1="580" y1="40" x2="580" y2="176" class="axis"/>
  <line x1="720" y1="40" x2="720" y2="176" class="axis"/>

  <text x="160" y="192" text-anchor="middle" class="tick">0</text>
  <text x="300" y="192" text-anchor="middle" class="tick">350</text>
  <text x="440" y="192" text-anchor="middle" class="tick">700</text>
  <text x="580" y="192" text-anchor="middle" class="tick">1050</text>
  <text x="720" y="192" text-anchor="middle" class="tick">1400</text>
  <text x="440" y="208" text-anchor="middle" class="tick">queries in a 30 second run</text>

  <text x="150" y="62" text-anchor="end" class="label">2000 RPS</text>
  <rect x="160" y="50" width="174" height="18" class="bad" rx="2"/>
  <text x="340" y="64" class="value">434</text>
  <rect x="160" y="72" width="41" height="18" class="good" rx="2"/>
  <text x="207" y="86" class="value">102</text>

  <text x="150" y="128" text-anchor="end" class="label">6000 RPS</text>
  <rect x="160" y="116" width="548" height="18" class="bad" rx="2"/>
  <text x="666" y="130" class="value">1370</text>
  <rect x="160" y="138" width="47" height="18" class="good" rx="2"/>
  <text x="213" y="152" class="value">118</text>

  <text x="20" y="234" class="note">Without singleflight the load on Postgres grows with traffic: three times the requests, three times</text>
  <text x="20" y="250" class="note">the queries. With it the load is flat, because it depends on how often keys expire, not on traffic.</text>
</svg>
