<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <style>
    .title { fill: #1f2328; font-size: 14px; font-weight: 600; }
    .label { fill: #1f2328; font-size: 12px; }
    .value { fill: #656d76; font-size: 11px; font-weight: 600; }
    .axis { stroke: #d0d7de; stroke-width: 1; }
    .tick { fill: #656d76; font-size: 10px; }
    .note { fill: #656d76; font-size: 11px; }
    .bad { fill: #f85149; }
    .mid { fill: #d29922; }
    .good { fill: #3fb950; }
    @media (prefers-color-scheme: dark) {
      .title { fill: #f0f6fc; }
      .label { fill: #f0f6fc; }
      .value { fill: #9198a1; }
      .axis { stroke: #3d444d; }
      .tick { fill: #9198a1; }
      .note { fill: #9198a1; }
    }
  </style>

  <text x="20" y="22" class="title">p95 on the task list at a fixed 800 requests per second</text>

  <line x1="200" y1="36" x2="200" y2="164" class="axis"/>
  <line x1="450" y1="36" x2="450" y2="164" class="axis"/>
  <line x1="700" y1="36" x2="700" y2="164" class="axis"/>

  <text x="200" y="180" text-anchor="middle" class="tick">10 ms</text>
  <text x="450" y="180" text-anchor="middle" class="tick">100 ms</text>
  <text x="700" y="180" text-anchor="middle" class="tick">1 s</text>

  <text x="190" y="58" text-anchor="end" class="label">1 process</text>
  <rect x="200" y="44" width="475" height="20" class="bad" rx="2"/>
  <text x="681" y="59" class="value">792 ms</text>

  <text x="190" y="88" text-anchor="end" class="label">2 processes</text>
  <rect x="200" y="74" width="172" height="20" class="mid" rx="2"/>
  <text x="378" y="89" class="value">49 ms</text>

  <text x="190" y="118" text-anchor="end" class="label">4 processes</text>
  <rect x="200" y="104" width="38" height="20" class="good" rx="2"/>
  <text x="244" y="119" class="value">14 ms</text>

  <text x="190" y="148" text-anchor="end" class="label">6 processes</text>
  <rect x="200" y="134" width="22" height="20" class="good" rx="2"/>
  <text x="228" y="149" class="value">12 ms</text>

  <text x="20" y="204" class="note">Logarithmic scale. Six processes look best here, but at 1200 RPS four beat six: 46 ms against</text>
  <text x="20" y="220" class="note">176 ms. Postgres and the load generator need cores too, and this machine only has six.</text>
</svg>
